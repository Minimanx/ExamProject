name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: client
      - run: npm run format:check
        working-directory: client
      - run: npm run lint
        working-directory: server
      - run: npm run format:check
        working-directory: server

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # mongodb-memory-server (v11) does not download into ~/.cache/mongodb-binaries
      # by default in this environment - pin it explicitly so the cache step below
      # actually caches the directory the binary is downloaded into.
      - name: Pin the mongodb-memory-server download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - run: npm ci
        working-directory: server
      # The postinstall download is disabled repo-wide (server/package.json
      # config.mongodbMemoryServer.disablePostinstall) so deploy builds stop
      # pulling a ~148MB mongod they never use. Fetch it explicitly here
      # instead, so a cold cache is never downloading inside vitest's setup
      # hook where it would race the timeout.
      - name: Ensure the mongod binary is present
        run: node --input-type=module -e "import {MongoMemoryServer} from 'mongodb-memory-server'; const s = await MongoMemoryServer.create(); await s.stop();"
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          PUBLIC_API_URL: http://localhost:5000
      # A dirty tree after a build means the build wrote output no ignore file
      # covers — that is how .vercel/output once got committed.
      - name: Build leaves no untracked output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Build produced files that are not gitignored:"
            git status --porcelain
            exit 1
          fi

  e2e:
    name: Client e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # The suite boots the real server against an in-memory MongoDB, so the
      # server's dependencies are needed too.
      - run: npm ci
        working-directory: server
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # mongodb-memory-server's postinstall is disabled repo-wide, so fetch the
      # binary explicitly rather than letting it download inside a test.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - name: Ensure the mongod binary is present
        run: node --input-type=module -e "import {MongoMemoryServer} from 'mongodb-memory-server'; const s = await MongoMemoryServer.create(); await s.stop();"
        working-directory: server
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
      - run: npm run test:e2e
        working-directory: client
        env:
          CI: "true"
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
